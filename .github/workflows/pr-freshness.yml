name: pr-freshness

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR-side gate: red until the head branch contains the latest main and
  # merges into it without conflicts.
  freshness-gate:
    name: Require rebase onto latest main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fail unless rebased onto the latest main and conflict-free
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Rule half 1: the branch must contain the tip of main (rebased,
          # or main merged in — both leave origin/main an ancestor of HEAD).
          if ! git merge-base --is-ancestor origin/main "$HEAD_SHA"; then
            behind="$(git rev-list --count "$HEAD_SHA..origin/main")"
            base="$(git merge-base "$HEAD_SHA" origin/main)"
            echo "::error title=Branch is behind main::HEAD is $behind commit(s) behind origin/main (merge-base ${base:0:12}). Rebase onto the latest main and push again: git fetch origin && git rebase origin/main."
            exit 1
          fi
          # Rule half 2: merging into main must apply cleanly. With half 1
          # holding this is trivially true (fast-forward); kept as the
          # explicit guard of the rule's second half.
          if ! git merge-tree --write-tree origin/main "$HEAD_SHA" >/dev/null; then
            echo "::error title=Merge conflict::Merging this branch into main conflicts. Rebase onto the latest main, resolve the conflicts, and push again."
            exit 1
          fi
          echo "OK: branch contains the latest main ($(git rev-parse --short origin/main)) and merges cleanly."

  # main-side refresh: whenever main moves, re-run the gate's predicates for
  # every open PR and post the verdict as a check run on the PR's head SHA,
  # under the same name as the gate job above (branch protection sees one
  # continuous required check). This turns a previously-green PR red the
  # moment main moves past it, without re-running the heavy build and without
  # depending on the "Require branches to be up to date" protection toggle.
  # It also gives a verdict to PRs opened before this workflow existed.
  refresh-gate:
    name: Refresh the gate on open PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-run the gate for every open PR against the new main
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_NAME: Require rebase onto latest main
        run: |
          set -euo pipefail
          gh pr list --base main --state open --limit 500 \
            --json number,headRefOid --jq '.[] | "\(.number) \(.headRefOid)"' \
          | while read -r pr head; do
              echo "Evaluating PR #$pr (head ${head:0:12}) against the new origin/main"
              git fetch --quiet --no-tags origin "refs/pull/$pr/head:refs/remotes/pr-$pr"
              if git merge-base --is-ancestor origin/main "$head" \
                 && git merge-tree --write-tree origin/main "$head" >/dev/null; then
                conclusion=success
                title="Up to date with the latest main"
                summary="Branch still contains the latest main and merges cleanly."
              else
                behind="$(git rev-list --count "$head..origin/main")"
                conclusion=failure
                title="Rebase needed: main has moved"
                summary="This branch is now out of date with the latest main ($behind commit(s) behind, or conflicting). Rebase onto the latest main and push again."
              fi
              gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
                -f head_sha="$head" \
                -f name="$CHECK_NAME" \
                -f status=completed \
                -f conclusion="$conclusion" \
                -f "output[title]=$title" \
                -f "output[summary]=$summary" >/dev/null
              echo "  -> $conclusion: $title"
            done
