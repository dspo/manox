name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: cargo build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libx11-dev \
            libxcb1-dev \
            libxrender-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libglib2.0-dev \
            libwayland-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Restore target cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-target-

      - name: Fmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Offline example gate
        run: ./crates/pi/scripts/check_examples.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            vscode/package-lock.json
            webui/package-lock.json

      - name: Build napi binding
        run: cargo build -p manox-napi

      - name: Install webui dependencies
        working-directory: webui
        run: npm ci

      - name: Build webui (bundle + contract staging)
        working-directory: webui
        run: npm run build

      - name: Install extension dependencies
        working-directory: vscode
        run: npm ci

      - name: Type-check and compile extension host
        working-directory: vscode
        run: npm run compile

      - name: Unit tests
        working-directory: vscode
        run: npm test

      - name: Stage napi binding
        working-directory: vscode
        run: |
          for candidate in ../target/debug/libmanox_napi.dylib ../target/debug/libmanox_napi.so ../target/debug/manox_napi.dll; do
            if [ -f "$candidate" ]; then cp "$candidate" manox_napi.node; break; fi
          done
          test -f manox_napi.node
          # Strip DWARF debug info: the unstripped debug cdylib (~0.5GB) makes
          # vsce's secret scanner error out and bloats the packaged vsix.
          strip manox_napi.node

      - name: Package vsix
        working-directory: vscode
        run: npx vsce package --no-dependencies --out manox-vscode.vsix

      - name: Save target cache
        if: github.event_name == 'push' && success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: target/
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

