# cx 配置文件结构（推荐版）
# 用户运行时路径：~/.manox/cx.providers.config.yaml
# 仓库基线示例：config/providers.default.yaml
#
# 设计目标：
# 1. Provider 表达“厂商 / 服务商”
# 2. Provider 下声明该厂商暴露的协议端点（anthropic / responses / completions）
# 3. models 使用以 model id 为 key 的 map，天然保证唯一性
# 4. 每个 model 通过 wire_apis 表达自己兼容哪些协议
# 5. agent 只声明自己支持哪些协议，cx 运行时自动推导 Provider / Model 可见性

providers:
  - name: "string (required, unique)"
    apikey_source: "string (optional)"
    endpoints:
      anthropic:
        url: "string (required)"
        agents: ["string (optional override filter)"]
        copilot_auth: "enum: api_key | bearer_token (optional; Packy API requires bearer_token for cx copilot)"
      responses:
        url: "string (required)"
      completions:
        url: "string (required)"
    models:
      model-id:
        desc: "string (optional)"
        wire_apis: ["enum: anthropic | responses | completions"]
        agents: ["string (optional override filter)"]
        env:
          VAR_NAME: "string (optional; 启动时注入的环境变量，仅用于配置值，不要存放密钥——密钥请用 apikey_source 或专用 env 文件)"
        max_tokens: "integer (optional; max tokens per response; defaults to a heuristic from context)"
        context: "integer (optional; model context window size in tokens, e.g. 1000000)"
        supports_tools: "bool (optional; default true)"
        supports_images: "bool (optional; default false)"

agents:
  - id: "string (required, unique)"
    bin: "string (required; binary is accepted as alias)"
    wire_apis: ["enum: anthropic | responses | completions"]
    env:
      VAR_NAME: "string (optional; 启动时注入的环境变量，仅用于配置值，不要存放密钥——密钥请用 apikey_source 或专用 env 文件)"

# VS Code 注入设置（Settings → 外部工具 → Visual Studio Code.app 面板读写）。
# 「打开 VS Code」（工具菜单 / 侧边栏单一入口 / CLI TUI）无 provider/model
# 选择交互，统一读取此段：
#   - claude_code 块 -> 向 VS Code 进程注入 ANTHROPIC_* BYOK env（Claude Code 扩展消费）
#   - codex 块       -> 复用 ChatGPT.app 注入机制（CODEX_HOME + config.toml，Codex 扩展消费），
#                       高级选项（env / supports_websockets）沿用顶层 chatgpt_app: 段
# 块缺省（整段未配置）= 启动时回落第一个兼容 Provider；disabled: true = 不注入该扩展；
# 两块均不注入时等效普通打开。
vscode_app:
  claude_code:
    provider: "string (optional; Anthropic wire provider 名，缺失时取第一个兼容 Provider)"
    disabled: "bool (optional; default false; true = 不注入 Claude Code 扩展)"
  codex:
    provider: "string (optional; Responses wire provider 名，缺失时取第一个兼容 Provider)"
    disabled: "bool (optional; default false; true = 不注入 Codex 扩展)"

# 子代理专属模型钉选（manox 宿主消费，cx 不解释其值，仅随配置一起 round-trip）。
# key = subagent 类型名（Explore / Sailor / 用户与插件定义的 agent），
# value = "provider::model::effort"：provider = 本文件中的 provider name（或其
# "{name}-{wire_api}" 注册形态）；model = 该 provider 下的模型 id；effort ∈
# off | low | medium | high | max（缺省 = 会话默认）。
subagents:
  Explore: "string (optional; provider::model::effort)"

# 运行时语义
#
# 1. 默认兼容性由下面两层自动推导：
#    - provider.endpoints.<wire_api>
#    - agents[].wire_apis
#
# 2. Provider 与 agent 的关联只依赖 `provider.endpoints.<wire_api>` 和
#    `agents[].wire_apis` 的兼容性；若 endpoints.<wire_api>.agents /
#    models.<id>.agents 出现，它们只作为额外过滤器。
#
# 3. models.<id>.wire_apis 缺省时，表示兼容该 Provider 下所有已声明 endpoints。
#
# 4. 同名模型在多个协议下都可用时，按以下优先级为每个 agent 去重并优先显示：
#    anthropic > responses > completions
#
# 5. 不同 agent 的启动映射：
#    - copilot + anthropic   -> COPILOT_PROVIDER_TYPE=anthropic
#    - copilot + responses   -> COPILOT_PROVIDER_TYPE=openai + WIRE_API=responses
#    - copilot + completions -> COPILOT_PROVIDER_TYPE=openai + WIRE_API=completions
#    - claude  + anthropic   -> ANTHROPIC_BASE_URL / ANTHROPIC_MODEL
#    - codex   + responses   -> 注入 synthetic provider config 后启动
