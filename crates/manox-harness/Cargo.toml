[package]
name = "manox-harness"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
rustpython.workspace = true
# Pin-only companions of `rustpython` (see the workspace manifest): pulled in
# so the parser-crate version constraint lives in a manifest, not the lock.
rustpython-ruff_python_ast.workspace = true
rustpython-ruff_python_parser.workspace = true
rustpython-ruff_python_trivia.workspace = true
rustpython-ruff_source_file.workspace = true
rustpython-ruff_text_size.workspace = true
async-channel.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "sync", "io-util", "macros", "rt-multi-thread"] }
tokio-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
uuid.workspace = true
chrono.workspace = true
globset.workspace = true
ignore.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
similar.workspace = true
regex.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
async-trait = "0.1"
jsonschema.workspace = true
libc.workspace = true
http = "1"
dirs = "6"
brush-core.workspace = true
brush-builtins.workspace = true
tera.workspace = true
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "fs", "net", "io-util"] }
tempfile = "3"

[lints]
workspace = true
