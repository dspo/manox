publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
gpui.workspace = true
zterm-core = { path = "../zterm-core" }
util = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
async-channel = "2.5.0"
regex = "1.5"
smol = "2.0"

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit"] }
