[package]
name = "agent"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
# Exposes `thread_store::init_for_test` / `drop_for_test` (and the `TEST_OVERRIDE`
# slot they mutate) to downstream crates' test suites. Production builds keep
# these hidden so the global `ThreadStore` path is the only one reachable.
test-support = []

[dependencies]
pi.workspace = true
pi-extensions.workspace = true
anyhow.workspace = true
async-trait = "0.1"
async-channel.workspace = true
futures.workspace = true
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }
brush-core = { workspace = true }
brush-builtins = { workspace = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
cx-providers.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
zstd.workspace = true
uuid.workspace = true
chrono.workspace = true
globset.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
similar.workspace = true
base64.workspace = true
image.workspace = true
rquickjs.workspace = true
http_proxy.workspace = true

gpui.workspace = true
rmcp = { workspace = true, features = ["client", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest"] }
supervisor.workspace = true
lsp.workspace = true
lsp-types.workspace = true
toml.workspace = true
http.workspace = true
fluent.workspace = true
unic-langid.workspace = true
tera.workspace = true
tokio-tungstenite = { workspace = true }
rustwright_core.workspace = true

[dev-dependencies]
# Self-reference with `test-support`: integration tests (`tests/`) compile the
# lib without `cfg(test)`, so the test seams (`init_for_test` /
# `drop_for_test` / `drop_global_for_test`) must come from the feature.
agent = { path = ".", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
