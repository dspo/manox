[package]
name = "manox"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "manox"
path = "src/main.rs"

[features]
default = ["harness-manox"]
# The two harnesses are mutually exclusive; the bin mounts exactly one
# workspace backend (see the compile_error! guards in src/main.rs).
harness-manox = ["agent-ui/harness-manox"]
harness-pi = ["agent-ui/harness-pi"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

agent-ui.workspace = true
agent.workspace = true
terminal.workspace = true
terminal-ui.workspace = true
supervisor.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

[package.metadata.bundle]
identifier = "dev.dspo.manox"
name = "Manox"
icon = ["resources/app-icon.icns", "resources/app-icon@2x.png", "resources/app-icon.png"]
osx_minimum_system_version = "10.15.7"

# Per-harness bundle identity so `--harness pi` and `--harness manox` builds
# can coexist in /Applications. script/bundle-mac reads the matching table.
[package.metadata.bundle.harness.pi]
name = "Manox Pi"
identifier = "dev.dspo.manox.pi"

[lints.clippy]
dbg_macro = "deny"
