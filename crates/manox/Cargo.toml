[package]
name = "manox"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "manox"
path = "src/main.rs"

[features]
default = []

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true

agent-ui.workspace = true
agent.workspace = true
cx.workspace = true
terminal.workspace = true
terminal-ui.workspace = true
supervisor.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

[package.metadata.bundle]
identifier = "dev.dspo.manox"
name = "Manox"
icon = ["resources/app-icon.icns", "resources/app-icon@2x.png", "resources/app-icon.png"]
osx_minimum_system_version = "10.15.7"

# Bundle identity for the pi harness build
# can coexist in /Applications. script/bundle-mac reads the matching table.
[package.metadata.bundle.harness.pi]
name = "Manox Pi"
identifier = "dev.dspo.manox.pi"

[lints.clippy]
dbg_macro = "deny"
