[package]
name = "manox-agent"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["lsp", "mcp"]
# MCP client (~/.manox/mcp.toml + plugin .mcp.json servers). The gpui app and
# the cx CLI keep it; lean embedders (the VS Code napi edge) may opt out —
# sessions then run without MCP tools (the registry simply never initializes).
mcp = ["dep:rmcp"]
# LSP integration (registry probe + read-only code-intel tools). Opting out
# degrades the agent to grep/glob search — the same fallback the engine uses
# when no LSP server is on PATH.
lsp = ["dep:lsp", "dep:lsp-types"]
# ChromeUse: the in-process rustwright CDP engine + ChromeUse* tools. The
# gpui app enables it; the VS Code host (manox-napi) builds without it so the
# engine never links into the shipped extension.
chrome-use = ["dep:rustwright_core"]
# Exposes `thread_store::init_for_test` / `drop_for_test` (and the `TEST_OVERRIDE`
# slot they mutate) to downstream crates' test suites. Production builds keep
# these hidden so the global `ThreadStore` path is the only one reachable.
test-support = []

[dependencies]
manox-harness.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait = "0.1"
async-channel.workspace = true
parking_lot.workspace = true
futures.workspace = true
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = { workspace = true }
brush-core = { workspace = true }
brush-builtins = { workspace = true }
brush-parser = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_yaml.workspace = true
schemars.workspace = true
manox-providers.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
zstd.workspace = true
uuid.workspace = true
chrono.workspace = true
globset.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
similar.workspace = true
base64.workspace = true
image.workspace = true

rmcp = { workspace = true, optional = true, features = ["client", "transport-async-rw", "transport-child-process", "transport-streamable-http-client-reqwest"] }
supervisor.workspace = true
lsp = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
toml.workspace = true
http.workspace = true
tera.workspace = true
tokio-tungstenite = { workspace = true }
rustwright_core = { workspace = true, optional = true }
html2text = "0.17.1"

[dev-dependencies]
# Self-reference with `test-support`: integration tests (`tests/`) compile the
# lib without `cfg(test)`, so the test seams (`init_for_test` /
# `drop_for_test` / `drop_global_for_test`) must come from the feature.
# `chrome-use` keeps the chrome_use module and its live tests in the suite.
manox-agent = { path = ".", features = ["test-support", "chrome-use"] }
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
