[package]
name = "manox-workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Durable Workspace domain: directory identity rows with an ordered, header-validated session account (dsh workspace parity)."

[dependencies]
anyhow.workspace = true
chrono.workspace = true
manox-agent.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
manox-harness.workspace = true
manox-agent = { workspace = true, features = ["test-support"] }
tempfile = "3"
