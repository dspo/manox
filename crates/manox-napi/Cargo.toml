[package]
name = "manox-napi"
version.workspace = true
edition.workspace = true
publish = false

[lib]
# `cdylib` for the packaged `.node` binding; `rlib` so `cargo test` can link
# the unit tests against the crate as a regular library (napi-rs convention).
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
manox-ahp.workspace = true
manox-ahp-runtime.workspace = true
manox-session-core.workspace = true
ahp-types.workspace = true
async-channel.workspace = true
# The workspace root declares manox-agent / manox-session-core with
# default-features = false so the CHOICE lives at each consumer edge; this
# crate re-exposes every subsystem as a passthrough feature below. Plain
# builds (`cargo build -p manox-napi`) therefore get the full runtime — any
# consumer (git dep or cargo flag) opts in/out per subsystem.
manox-agent.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
[features]
# The binding re-exposes the runtime's capability sets as feature passthroughs;
# `default` carries the full runtime. An embedder that wants a lean addon builds
# with --no-default-features and re-enables only what it serves.
default = ["mcp"]
# The MCP face: the agent-side registry *and* the session-core gateway that
# serves start/stop. Both halves are the feature — the registry alone lets a
# host see the servers without the gateway that drives them.
mcp = ["manox-agent/mcp", "manox-session-core/mcp"]
