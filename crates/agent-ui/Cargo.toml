[package]
name = "agent-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "agent_ui"
path = "src/lib.rs"

[features]
default = ["harness-manox"]
# The manox self-built harness backend (the polished, feature-complete path).
# Mutually exclusive with `harness-pi`; the `manox` bin guards both ways.
harness-manox = []
# Mount the pi harness backend: the workspace drives a `pi_backend::PiSession`
# adapter (cfg-gated module) instead of the manox `agent::Thread`. Selected at
# build time by the `manox` bin (`--no-default-features --features harness-pi`);
# the default build never compiles the pi dependencies.
harness-pi = ["dep:pi", "dep:pi-extensions"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rust-embed.workspace = true

agent.workspace = true
terminal.workspace = true
terminal-ui.workspace = true
manox-components.workspace = true
open.workspace = true
manox-webview.workspace = true

# cx library —— `AgentBuilder` / `SessionHandle` to spawn external agent CLIs
# (claude/codex/copilot) and hold the PTY handle for an `ExternalSession`.
cx.workspace = true

# pi harness backend — only compiled for the `harness-pi` feature.
pi = { workspace = true, optional = true }
pi-extensions = { workspace = true, optional = true }

[dev-dependencies]
agent = { workspace = true, features = ["test-support"] }
terminal = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

[lints.clippy]
dbg_macro = "deny"
