[package]
name = "agent-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "agent_ui"
path = "src/lib.rs"

[features]
default = []
# Exposes the `Workspace::diagnostic_*` hooks and the full-workspace overlap
# walk test (`tests/workspace_overlap.rs`). The walk additionally requires the
# local session fixture and is a no-op without it. Run locally via:
#   cargo test -p agent-ui --features test-support --test workspace_overlap
test-support = []


[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
rust-embed.workspace = true

manox-agent.workspace = true
manox-terminal.workspace = true
terminal-ui.workspace = true
manox-components.workspace = true
open.workspace = true
manox-webview.workspace = true

# cx library —— `AgentBuilder` / `SessionHandle` to spawn external agent CLIs
# (claude/codex/copilot) and hold the PTY handle for an `ExternalSession`.
cx.workspace = true

# cx provider config schema —— the Settings → Models panel edits
# `cx.providers.config.yaml` through these structs.
manox-providers.workspace = true

# pi harness backend.
manox-harness = { workspace = true }
manox-protocol.workspace = true
manox-session-core.workspace = true


[dev-dependencies]
manox-agent = { workspace = true, features = ["test-support"] }
manox-terminal = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints.clippy]
dbg_macro = "deny"
