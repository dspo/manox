[package]
name = "manox-actor"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# test-support exposes the ThreadStore teardown seam (drop_global_for_test);
# this host shuts the gpui context down on demand (window reload,
# deactivate), unlike the app where it lives until process exit.
agent = { workspace = true, features = ["test-support"] }
pi-extensions.workspace = true
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
