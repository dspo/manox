[package]
name = "manox-ahp"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = []
# WS host transport over axum's WebSocketUpgrade (enabled by the gateway that
# mounts `/ahp`). The crate stays axum-free without it.
axum-ws = ["dep:axum", "dep:futures"]

[dependencies]
ahp-types.workspace = true
# The host reuses the SDK's pure reducers as its authoritative fold: the spec
# requires the same reducer code on both ends, and `ahp` is where the Rust port
# lives. Client-facing SDK pieces of that crate are not used here.
ahp.workspace = true
manox-journal.workspace = true
async-channel.workspace = true
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true

[dev-dependencies]
ahp-ws.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
