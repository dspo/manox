[package]
name = "manox-session-core"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# The session core drives gpui-free `ThreadHandle`s through the `agent`
# handles and runtime, so the crate must stay out of the agent test-support
# feature graph: feature unification would leak `test-support` into any
# release build that pulls this crate. The test-support dev-dependency
# below keeps that graph out of the normal build.
manox-agent.workspace = true
manox-harness.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
manox-protocol.workspace = true
manox-workspace.workspace = true
# v3 (AHP) W2: the read-only journal → AHP channel-state fold (`src/ahp/`)
# runs the host's own translator + the shared `ahp` reducers over the
# journal, and reads the durable vocabulary from the leaf journal crate.
manox-ahp.workspace = true
manox-journal.workspace = true
ahp.workspace = true
ahp-types.workspace = true
manox-terminal = { workspace = true, optional = true }
parking_lot.workspace = true
# The WS gateway transport arm (`src/ws/`) — the network face of the
# protocol gateway, kept per the frontend-removal decision ("keep the
# implemented http/ws interfaces"); `cx web` starts it headless.
# (async-channel is already a dependency below.)
axum = { workspace = true, optional = true }
tracing.workspace = true
# §D.2 `CreateSession` mints session ids server-side for v2 clients.
uuid.workspace = true
async-channel.workspace = true

[dev-dependencies]
libc.workspace = true
# The session tests swap scripted engines via `set_engine_for_test` and tear
# the process-global ThreadStore down via `drop_global_for_test`; both
# require the agent test-support feature. Dev-dependencies never enter the
# release dependency graph, so the feature-unification constraint above
# still holds.
anyhow.workspace = true
manox-agent = { workspace = true, features = ["test-support"] }
async-channel = { workspace = true }
# W7: the WS e2e test's client leg (same version axum's ws feature already
# pulls into the graph — no new resolution).
tokio-tungstenite.workspace = true
# v3 (AHP): the transport-parity test dials the gateway with the SDK's own
# WebSocket client, so the WS leg is exercised by a real AHP client rather
# than a hand-rolled frame pump.
ahp-ws.workspace = true
futures.workspace = true

[features]
default = ["terminal", "ws-gateway"]
# In-process PTY + grid terminals (#13): the follow-terminal streams, attach/
# snapshot/input/resize arms, and the TerminalsUpdated host mirror. Lean
# embedders (the VS Code napi edge) opt out; the arms then answer GW7's
# `feature/unavailable` stable code.
terminal = ["dep:manox-terminal"]
# The `cx web` loopback WS gateway (axum). The in-process hosts (gpui, napi)
# never serve HTTP; opting out drops the axum/hyper server stack.
ws-gateway = ["dep:axum", "manox-ahp/axum-ws"]
