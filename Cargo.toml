# manox —— 自研 agent runtime 库仓（gpui-free）。
#
# workspace 根。核心 crate（对外以 git 依赖形式提供给 host，如 dspo/manox-app）：
#   - manox-harness:      agent 内核（pi 核心的 Rust 移植：agent loop、providers、
#                         sessions、tools + ext 扩展）
#   - manox-agent:        host 层（Thread + LanguageModel + tools + SQLite 持久化
#                         + MCP/LSP 接线）
#   - manox-session-core: 无上下文会话编排（AgentServer/AgentClient 协议网关、
#                         journal 查询、projections、waterfall、ws 网关）
#   - manox-protocol:     传输无关双向 RPC + journal/protocol v2 词汇
#   - manox-napi:         napi-rs 绑定（dormant，为未来 TS host 保留）
#   - manox-providers:    ~/.manox/cx.providers.config.yaml 解析的单一事实来源
#   - supervisor / lsp:   进程总线与 LSP 客户端（manox-agent 的基础设施）
#
# LLM 直连 ~/.manox/cx.providers.config.yaml 定义的 providers。
#
# gpui 桌面应用、cx 启动器（ext-agents/terminal/hyperlinks）在独立仓库
# dspo/manox-app 维护；拆分点为 tag pre-manox-app-split。
[workspace]
members = [
	"crates/manox-agent",
	"crates/manox-harness",
	"crates/supervisor",
	"crates/lsp",
	"crates/manox-providers",
	"crates/manox-session-core",
	"crates/manox-napi",
	"crates/manox-protocol",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# Workspace members — declared here so sub-crates reference them via
# `foo.workspace = true` instead of relative `path = "../foo"`.
manox-agent = { path = "crates/manox-agent" }
supervisor = { path = "crates/supervisor" }
lsp = { path = "crates/lsp" }
manox-session-core = { path = "crates/manox-session-core" }
manox-protocol = { path = "crates/manox-protocol" }
manox-harness = { path = "crates/manox-harness" }
# manox-providers —— provider 配置解析的单一事实来源（原 github.com/dspo/cx
# 仓库并入；cx 启动器本体已随拆分移至 dspo/manox-app）。
manox-providers = { path = "crates/manox-providers" }

anyhow = "1"
async-channel = "2"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "net"] }
tokio-util = "0.7"
libc = "0.2"
# brush: in-process bash-compatible shell used as the bash tool's execution engine.
brush-core = "0.5.0"
brush-builtins = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["derive"] }
jsonschema = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
globset = "0.4"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }
similar = "2"
regex = "1"
thiserror = "1"
base64 = "0.22"
# image —— clipboard image resize + PNG re-encode before sending to the provider
# (Anthropic long-edge cap 1568px / 5MB). CPU-bound work runs on the background executor.
image = "0.25"

rmcp = { version = "1.8", default-features = false }
# lsp-types —— LSP protocol types (InitializeParams, Location, Hover, ...). The
# wire framer is hand-rolled (see crates/lsp/src/proto.rs); this crate only
# supplies typed structs for the params/results we send and parse.
lsp-types = "0.97"
toml = "0.8"
http = "1"

# rustwright-core — ChromeUse's in-process Chromium CDP engine (Rust rewrite
# of Playwright's automation core; no driver subprocess, fits the
# single-binary deliverable). default-features = false strips the `python`
# feature (PyO3). The dep key carries the crate's Rust identifier: its lib
# target is `_rustwright` (the PyO3 module name), so `rustwright-core` would
# be unusable as a path prefix. Alpha crate: pinned by rev, upgraded
# deliberately; switch back to the crates.io index version once a release
# catches up with main.
rustwright_core = { package = "rustwright-core", git = "https://github.com/Skyvern-AI/rustwright.git", rev = "af71449ea25ad45b1028581edefab1f523f9550d", default-features = false }

# i18n —— fluent + BCP47 LanguageIdentifier。agent 自身的 locales/*.ftl 模型
# 面向字符串一律英文，不经此栈；此处仅供 host 侧 chrome 文案复用同一版本。
fluent = "0.17"
unic-langid = "0.9"

# tera —— prompt 模板引擎。所有模型可见提示词以纯文本 .tera.md 维护，仅在
# 统一边界（prompt::render）一次性渲染。业务流程只构造强类型 data/draft，不拼字符串。
tera = "2"

parking_lot = "0.12"

tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }
