# manox —— 自研 agent runtime 库仓（gpui-free）。
#
# workspace 根。核心 crate（对外以 git 依赖形式提供给 host，如 dspo/manox-app）：
#   - manox-harness:      agent 内核（agent loop、providers、
#                         sessions、tools + ext 扩展）
#   - manox-agent:        host 层（Thread + LanguageModel + tools + SQLite 持久化
#                         + MCP 接线）
#   - manox-ahp:          Agent Host Protocol 宿主层（频道、JSON-RPC、传输）
#   - manox-ahp-runtime:  AHP 宿主背后的运行时半边（SessionRuntime 缝）
#   - manox-session-core: 无上下文会话编排（会话存储 + AHP 运行时缝的实现）
#   - manox-napi:         napi-rs 绑定（dormant，为未来 TS host 保留）
#   - manox-providers:    ~/.manox/cx.providers.config.yaml 解析的单一事实来源
#   - supervisor / manox-lsp: 进程总线与对外 LSP 客户端库（manox-lsp 是唯一
#                         零仓内消费者的成员——为宿主预留的积木，宿主 app 按需装配）
#
# LLM 直连 ~/.manox/cx.providers.config.yaml 定义的 providers。
#
# gpui 桌面应用、cx 启动器（ext-agents）在独立仓库 dspo/manox-app 维护；
# 拆分点为 tag pre-manox-app-split。hyperlinks 已回流本仓；终端仿真
# （manox-terminal + terminal-ui）已随 Ghostty 迁移整体退役。
[workspace]
members = [
	"crates/manox-agent",
	"crates/manox-harness",
	"crates/supervisor",
	"crates/manox-lsp",
	"crates/manox-providers",
	"crates/manox-session-core",
	"crates/manox-napi",
	"crates/manox-ahp",
	"crates/manox-ahp-runtime",
	"crates/hyperlinks",
	"crates/manox-workspace",
	"crates/manox-codemode",
]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2024"
publish = false

[workspace.dependencies]
# Workspace members — declared here so sub-crates reference them via
# `foo.workspace = true` instead of relative `path = "../foo"`.
# default-features = false on the two gated members moves the subsystem choice
# to each consumer edge (manox-napi re-exposes passthrough features; members
# that consume these crates as libraries need none of the gated subsystems).
# External git consumers (manox-app) control features through their own dep
# declarations and keep the defaults.
manox-agent = { path = "crates/manox-agent", default-features = false }
supervisor = { path = "crates/supervisor" }
manox-session-core = { path = "crates/manox-session-core", default-features = false } # see the manox-agent note above
manox-workspace = { path = "crates/manox-workspace" }
# manox-ahp —— AHP（Agent Host Protocol）宿主半边：JSON-RPC 路由、全局
# serverSeq、通道注册与订阅、journal→AHP 动作翻译、x-manox 扩展声明面。
# 前端（GPUI 桌面/远程客户端）一律经它对话；v2 面拆除后为唯一协议层。
manox-ahp = { path = "crates/manox-ahp" }
# manox-ahp-runtime —— AHP 宿主的运行时半边（与传输无关的 manox-ahp 分离）。
manox-ahp-runtime = { path = "crates/manox-ahp-runtime", default-features = false }
manox-harness = { path = "crates/manox-harness" }
# manox-codemode —— QuickJS 脚本沙箱与工具桥（零 manox-harness 依赖；消费者
# 把自己的工具类型适配成它的 CodemodeTool trait）。唯一消费者：manox-harness
# 的 core/tools/codemode.rs（CodemodeTool 的 AgentTool 薄壳）。
manox-codemode = { path = "crates/manox-codemode" }
# manox-providers —— provider 配置解析的单一事实来源（原 github.com/dspo/cx
# 仓库并入；cx 启动器本体已随拆分移至 dspo/manox-app）。
manox-providers = { path = "crates/manox-providers" }
hyperlinks = { path = "crates/hyperlinks" }
# rquickjs — the codemode sandbox's QuickJS bindings (bundled backend is
# quickjs-ng, compiled from vendored C via cc, no extra toolchain). Exact pin:
# 0.14.x is the post-overhaul line whose API and feature surface still breaks
# between minors, so upgrading is an explicit task, not drive-by. Features are
# `std` only: `loader`/`dyn-load` are exactly the module loading the sandbox
# must not have, `futures` couples the VM's driving to the host executor via
# AsyncRuntime, and `rust-alloc` swaps in a custom allocator that silently
# disables `set_memory_limit` — the engine keeps QuickJS's own allocator and
# accounting.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

anyhow = "1"
async-channel = "2"
# async-trait — the AHP seams (`Backend`, `SessionRuntime`) are async; both are
# held as `dyn` trait objects, which is what the macro adds over native AFIT.
async-trait = "0.1"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
# ahp / ahp-types —— Agent Host Protocol 官方 Rust crate（wire 类型 + 客户端
# + 纯 reducer）。精确 pin：minor 间仍可能破坏（官方仅承诺 1.0.0/0.9.0 两条
# 协商基线）；升级是显式任务而非顺手之举。宿主侧只用 ahp-types（类型）与
# ahp::reducers（双端同码 fold）。
ahp-types = "=1.0.0"
ahp = "=1.0.0"
ahp-ws = "=1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "process", "io-util", "net"] }
tokio-util = "0.7"
libc = "0.2"
# seccompiler — the seccomp filter compiler for the Linux sandbox backend
# (deny-face filter compiled in-process, applied across a pre_exec boundary).
seccompiler = "0.5"
# brush: in-process bash-compatible shell used as the bash tool's execution engine.
brush-core = "0.5.0"
brush-builtins = "0.2.0"
# brush's shell parser (already in the tree via brush-core): plan mode uses it
# to classify Bash commands syntactically before admitting read-only git calls.
brush-parser = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["derive"] }
jsonschema = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
globset = "0.4"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }
similar = "2"
regex = "1"
thiserror = "1"
base64 = "0.22"
# image —— clipboard image resize + PNG re-encode before sending to the provider
# (Anthropic long-edge cap 1568px / 5MB). CPU-bound work runs on the background executor.
image = "0.25"

rmcp = { version = "1.8", default-features = false }
# lsp-types —— LSP protocol types (InitializeParams, Location, Hover, ...). The
# wire framer is hand-rolled (see crates/manox-lsp/src/proto.rs); this crate only
# supplies typed structs for the params/results we send and parse.
lsp-types = "0.97"
toml = "0.8"
http = "1"

# tera —— prompt 模板引擎。所有模型可见提示词以纯文本 .tera.md 维护，仅在
# 统一边界（prompt::render）一次性渲染。业务流程只构造强类型 data/draft，不拼字符串。
tera = "2"

parking_lot = "0.12"

rustix = "0.38"

tokio-tungstenite = { version = "0.24", features = ["connect", "native-tls"] }

# Shared lint set, inherited by every crate declaring `[lints] workspace = true`.
[workspace.lints.rust]
# ld64 reports "`__eh_frame` section too large" when a debug test binary links
# the embedded interpreter: compact-unwind encoding runs out of capacity, which
# costs unwind-table compactness, not correctness. A linker note, not a defect.
linker_messages = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
